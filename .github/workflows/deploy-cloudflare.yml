# Deploys each app to its existing Cloudflare Pages project (direct-upload projects) whenever
# its folder changes on main. Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission
# "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped.
# Run manually from the Actions tab to redeploy everything.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['invoice-pwa/**', 'stampbook/**', 'stayline/**', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: invoice-pwa, project: quickbill-app,    test: 'npm test',                         build: 'npm run build' }
          - { dir: stampbook,   project: stampbook,        test: 'node --test test/*.test.js',      build: 'node scripts/build.js --dist' }
          - { dir: stayline,    project: stayline-family,  test: 'node --test test/*.test.js',      build: 'node scripts/build-pages.js' }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: ${{ matrix.test }}
      - name: Build
        run: ${{ matrix.build }}
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        # Run from the app folder so wrangler picks up ./functions (the licence check) next to dist/.
        run: npx --yes wrangler@4 pages deploy dist --project-name=${{ matrix.project }} --branch=main --commit-dirty=true
      - name: Note when skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::Deploy skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
