<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quotanest — Use less of your AI coding limit</title>

<header class="site">
  <a class="brand" href="/" data-t="brand">Quotanest</a>

      <option value="en">English</option><option value="ko">한국어</option><option value="ja">日本語</option><option value="zh">中文</option><option value="es">Español</option>

    <a class="btn small" href="app/" data-t="nav_app">Open the app</a>
  </div>
</header>
<main>
  <section class="hero">
    <h1 data-t="hero_title">Use less of your AI coding limit.</h1>

    <div class="cta">
      <a class="btn" href="app/" data-t="cta_open">Open the app</a>
      <span class="price" data-t="cta_price"></span>

      <li data-t="how_1"></li>
      <li data-t="how_2"></li>
      <li data-t="how_3"></li>

  <section class="faq">

    <details><summary data-t="faq_q3"></summary><p data-t="faq_a3"></p></details>
  </section>
  <p class="nonaff" data-t="nonaff"></p>

<footer class="site">
  <span data-t="footer_note"></span>
  <nav><a href="privacy.html" data-t="nav_privacy">Privacy</a> <a href="terms.html" data-t="nav_terms">Terms</a></nav>
