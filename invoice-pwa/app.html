<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickBill</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar noprint">
  <h1><a href="index.html">QuickBill</a></h1>
  <select id="lang" class="lang" aria-label="Language"></select>
  <span id="plan" class="badge"></span>
  <button id="btn-new" data-i18n="newInvoice"></button>
  <button id="btn-upgrade" class="pro" data-i18n="goPro"></button>
</header>
<main>
  <section id="list-view" class="noprint">
    <p class="muted" data-i18n="privacy"></p>
    <div id="list"></div>
    <p class="muted" id="empty" data-i18n="empty"></p>
    <div class="row">
      <button id="btn-csv" class="ghost" data-i18n="exportCsv"></button>
      <button id="btn-backup" class="ghost" data-i18n="backup"></button>
      <button id="btn-restore" class="ghost" data-i18n="restore"></button>
      <input type="file" id="file-restore" accept="application/json" hidden>
    </div>
  </section>

  <section id="edit-view" hidden>
    <form id="form" class="noprint">
      <div class="grid">
        <label><span data-i18n="from"></span><input name="from" required></label>
        <label><span data-i18n="client"></span><input name="client" list="clients" required></label>
        <datalist id="clients"></datalist>
        <label><span data-i18n="number"></span><input name="number" required></label>
        <label><span data-i18n="currency"></span>
          <select name="currency"><option>USD</option><option>EUR</option><option>GBP</option><option>KRW</option><option>JPY</option><option>CNY</option><option>CAD</option><option>AUD</option></select></label>
        <label><span data-i18n="issue"></span><input type="date" name="issueDate" required></label>
        <label><span data-i18n="due"></span><input type="date" name="dueDate" required></label>
        <label><span data-i18n="tax"></span><input type="number" step="0.01" min="0" name="taxRate" value="0"></label>
        <label><span data-i18n="discount"></span><input type="number" step="0.01" min="0" name="discount" value="0"></label>
        <label><span data-i18n="status"></span>
          <select name="status"><option value="draft" data-i18n="draft"></option><option value="sent" data-i18n="sent"></option><option value="paid" data-i18n="paid"></option></select></label>
        <label><span data-i18n="recurring"></span>
          <select name="recur"><option value="" data-i18n="none"></option><option value="weekly" data-i18n="weekly"></option><option value="monthly" data-i18n="monthly"></option></select></label>
        <label><span data-i18n="logo"></span><input type="file" id="logo-file" accept="image/*"></label>
      </div>
      <h3 data-i18n="items"></h3>
      <div id="items"></div>
      <button type="button" id="btn-add" class="ghost" data-i18n="addItem"></button>
      <label><span data-i18n="notes"></span><textarea name="notes" rows="2"></textarea></label>
      <div class="row">
        <button type="submit" data-i18n="save"></button>
        <button type="button" id="btn-print" class="ghost" data-i18n="print"></button>
        <button type="button" id="btn-logo-rm" class="ghost" data-i18n="logoRemove"></button>
        <button type="button" id="btn-delete" class="ghost danger" data-i18n="del"></button>
        <button type="button" id="btn-back" class="ghost" data-i18n="back"></button>
      </div>
    </form>
    <article id="preview"></article>
  </section>
  <p id="toast" class="toast noprint" hidden></p>
</main>

<dialog id="dlg">
  <h2 data-i18n="proTitle"></h2>
  <p><span data-i18n="proBody"></span> <b id="price"></b></p>
  <p><a id="buy" target="_blank" rel="noopener" data-i18n="buy"></a></p>
  <form method="dialog" id="lic-form">
    <input id="lic" placeholder="PRO-XXXX-XXXX-XXXX" autocomplete="off">
    <button value="ok" data-i18n="activate"></button>
    <button value="cancel" class="ghost" data-i18n="close"></button>
  </form>
  <p id="lic-msg" class="muted"></p>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
