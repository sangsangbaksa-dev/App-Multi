<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickBill – Invoices for freelancers</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar noprint">
  <h1>QuickBill</h1>
  <span id="plan" class="badge"></span>
  <button id="btn-new">+ New invoice</button>
  <button id="btn-upgrade" class="pro">Go Pro</button>
</header>
<main>
  <section id="list-view" class="noprint">
    <div id="list"></div>
    <p class="muted" id="empty">No invoices yet. Create your first one.</p>
    <button id="btn-csv" class="ghost">Export CSV (Pro)</button>
  </section>

  <section id="edit-view" hidden>
    <form id="form" class="noprint">
      <div class="grid">
        <label>Your name / business<input name="from" required></label>
        <label>Client<input name="client" required></label>
        <label>Invoice #<input name="number" required></label>
        <label>Currency
          <select name="currency"><option>USD</option><option>EUR</option><option>GBP</option><option>KRW</option><option>JPY</option><option>CAD</option><option>AUD</option></select></label>
        <label>Issue date<input type="date" name="issueDate" required></label>
        <label>Due date<input type="date" name="dueDate" required></label>
        <label>Tax %<input type="number" step="0.01" min="0" name="taxRate" value="0"></label>
        <label>Discount<input type="number" step="0.01" min="0" name="discount" value="0"></label>
        <label>Status<select name="status"><option>draft</option><option>sent</option><option>paid</option></select></label>
      </div>
      <h3>Items</h3>
      <div id="items"></div>
      <button type="button" id="btn-add" class="ghost">+ Add item</button>
      <label>Notes<textarea name="notes" rows="2"></textarea></label>
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" id="btn-print" class="ghost">Print / PDF</button>
        <button type="button" id="btn-delete" class="ghost danger">Delete</button>
        <button type="button" id="btn-back" class="ghost">Back</button>
      </div>
    </form>
    <article id="preview"></article>
  </section>
</main>

<dialog id="dlg">
  <h2>QuickBill Pro</h2>
  <p>Unlimited invoices, no watermark, CSV export. <b id="price"></b></p>
  <p><a id="buy" target="_blank" rel="noopener">Buy a license</a></p>
  <form method="dialog" id="lic-form">
    <input id="lic" placeholder="PRO-XXXX-XXXX-XXXX" autocomplete="off">
    <button value="ok">Activate</button>
    <button value="cancel" class="ghost">Close</button>
  </form>
  <p id="lic-msg" class="muted"></p>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
