<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickBill – Invoices for freelancers</title>
<meta name="description" content="Private, offline invoice maker for freelancers. Pay once, no subscription. English, 한국어, 日本語, 中文, Español.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="style.css">
</head>
<body class="landing">
<header class="bar"><h1>QuickBill</h1><select id="lang" class="lang" aria-label="Language"></select></header>
<main>
  <section class="hero">
    <h2 data-i18n="heroTitle"></h2>
    <p data-i18n="heroSub"></p>
    <a class="btn" href="app.html" data-i18n="open"></a>
  </section>
  <section><h3 data-i18n="polTitle"></h3>
    <div class="cards">
      <div class="pc"><b data-i18n="p1t"></b><p data-i18n="p1d"></p></div>
      <div class="pc"><b data-i18n="p2t"></b><p data-i18n="p2d"></p></div>
      <div class="pc"><b data-i18n="p3t"></b><p data-i18n="p3d"></p></div>
      <div class="pc"><b data-i18n="p4t"></b><p data-i18n="p4d"></p></div>
    </div></section>
  <section><h3 data-i18n="featTitle"></h3>
    <ul><li data-i18n="f1"></li><li data-i18n="f2"></li><li data-i18n="f3"></li><li data-i18n="f4"></li><li data-i18n="f5"></li><li data-i18n="f6"></li></ul></section>
  <section><h3 data-i18n="priceTitle"></h3>
    <div class="cards">
      <div class="pc"><b data-i18n="freeName"></b> <span data-i18n="priceFree"></span><p data-i18n="freeList"></p></div>
      <div class="pc hl"><b data-i18n="proName"></b> <span data-i18n="priceProV"></span><p data-i18n="proList"></p></div>
    </div>
    <p><a class="btn" href="app.html" data-i18n="open"></a></p></section>
</main>
<footer class="muted" data-i18n="footer"></footer>
<script type="module">
import * as I from "./i18n.js";
let saved = null; try { saved = localStorage.getItem("qb.lang"); } catch {}
I.setLang(I.detectLang(saved));
const sel = document.getElementById("lang");
const go = () => { I.applyI18n(); document.title = "QuickBill – " + I.t("heroTitle"); };
I.langSelect(sel, (l) => { I.setLang(l); try { localStorage.setItem("qb.lang", l); } catch {} go(); });
go();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
